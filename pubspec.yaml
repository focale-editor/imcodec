name: imcodec
description: Focused BMP, GIF, JBIG2, JPEG, JPEG XL, OpenEXR, PNG, QOI, TGA, TIFF, and WebP codecs for RGBA images in Flutter.
version: 0.5.8
homepage: https://github.com/focale-editor/imcodec
repository: https://github.com/focale-editor/imcodec

topics:
  - image
  - image-processing
  - codec
  - compression
  - flutter

screenshots:
  - description: 'A flat illustration of focused raster image codecs.'
    path: screenshots/overview.png

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  zcodec: '>=0.2.3 <0.3.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  release: ^0.2.0
  crypto: ^3.0.8

release:
  changelog:
    header: '# 📰 Imcodec changelog'
    defaultIgnoredTypes: ['test']
    defaultIgnoredScopes: ['repo', 'docs', 'version', 'deps', 'tools']
