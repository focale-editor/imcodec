name: imcodec
description: Focused BMP, JPEG, PNG, QOI, TGA, and WebP codecs for RGBA images in Flutter.
version: 0.1.0
homepage: https://github.com/focale-editor/imcodec

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  release: ^0.1.10

release:
  changelog:
    header: '# 📰 Imcodec changelog'
    defaultIgnoredTypes: ['test']
    defaultIgnoredScopes: ['repo', 'docs', 'version', 'deps', 'tools']
